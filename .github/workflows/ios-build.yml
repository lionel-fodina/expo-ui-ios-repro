name: iOS simulator Release build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: macos-26
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # @expo/ui 57.0.20 is what the lockfile resolves (transitively, via
          # the ^57.0.20 range of expo-router 57.0.23).
          - variant: unpatched
            expo-ui: "57.0.20"
            rn-patch: false
          # React Native spm.rb with facebook/react-native#57576 applied
          # (patches/react-native@0.86.3.patch).
          - variant: rn-57576-patch
            expo-ui: "57.0.20"
            rn-patch: true
          - variant: control-expo-ui-57.0.19
            expo-ui: "57.0.19"
            rn-patch: false
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install CocoaPods 1.16.2 (same as EAS)
        run: sudo gem install cocoapods -v 1.16.2 && pod --version

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          CHANGED=false
          if [ "${{ matrix.rn-patch }}" != "true" ]; then
            sed -i '' '/^patchedDependencies:/,/^  react-native@/d' pnpm-workspace.yaml
            CHANGED=true
          fi
          if [ "${{ matrix.expo-ui }}" != "57.0.20" ]; then
            printf 'overrides:\n  "@expo/ui": %s\n' "${{ matrix.expo-ui }}" >> pnpm-workspace.yaml
            CHANGED=true
          fi
          cat pnpm-workspace.yaml
          if [ "$CHANGED" = true ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
          echo "spm.rb collision fix present: $(grep -c 'def new_object' apps/mobile/node_modules/react-native/scripts/cocoapods/spm.rb || true)"

      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Check Pods.xcodeproj root object
        working-directory: apps/mobile/ios
        run: |
          F=Pods/Pods.xcodeproj/project.pbxproj
          ROOT=$(grep -oE 'rootObject = [0-9A-F]+' "$F" | awk '{print $3}')
          echo "rootObject: $ROOT"
          echo "PBXProject objects: $(grep -c 'isa = PBXProject;' "$F")"
          grep -n -A2 -E "^\s+$ROOT " "$F" | head -6

      - name: Build (Release, iOS simulator)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log

      - name: Show dependency graph
        if: always()
        working-directory: apps/mobile/ios
        run: |
          grep -n -E "is damaged|unrecognized selector" xcodebuild.log | head -3 || true
          grep -n -A3 -E "Resolve Package Graph|Target dependency graph" xcodebuild.log || true
          grep -m5 -E "error:" xcodebuild.log || true

      - name: Upload project files and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-${{ matrix.variant }}
          path: |
            apps/mobile/ios/xcodebuild.log
            apps/mobile/ios/Podfile
            apps/mobile/ios/Podfile.lock
            apps/mobile/ios/Podfile.properties.json
            apps/mobile/ios/*.xcworkspace/contents.xcworkspacedata
            apps/mobile/ios/*.xcodeproj/project.pbxproj
            apps/mobile/ios/Pods/Pods.xcodeproj/project.pbxproj
